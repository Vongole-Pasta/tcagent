spring:
  datasource:
    url: jdbc:h2:mem:shopone;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: shopone-jwt-secret-key-for-test-must-be-at-least-256-bits-long-enough
  expiration: 3600000  # 1시간 (밀리초)

logging:
  level:
    com.shopone: DEBUG
