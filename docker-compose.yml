services:
  # Nginx 역프록시: 사내망 웹 접속(80/443)을 프론트엔드와 백엔드로 중계합니다.
  nginx:
    image: nginx:alpine
    container_name: tcagent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL 인증서가 준비되면 아래와 같이 마운트하여 사용할 수 있습니다.
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: always

  # 프론트엔드 서비스 (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: tcagent-frontend
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: always

  # 백엔드 서비스 (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tcagent-backend
    # 외부 API 키(OpenAI 등)는 VM 내 배포 경로의 .env 파일에서 자동으로 주입받습니다.
    env_file:
      - .env
    environment:
      - APP_ENV=prd
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=rhkswp!123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tcagent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=rhkswp!123
    depends_on:
      - neo4j
      - postgres
    restart: always

  # 그래프 데이터베이스 서비스 (Neo4j)
  # 로컬 PC 관리를 위해 포트를 노출합니다. (배포 시 필요에 따라 격리 가능)
  neo4j:
    image: neo4j:5.18.0
    container_name: tcagent-neo4j
    ports:
      - "7474:7474" # Neo4j Browser 웹 콘솔 포트
      - "7687:7687" # Neo4j Bolt 프로토콜 포트
    environment:
      - NEO4J_AUTH=neo4j/rhkswp!123
      # 힙 메모리 크기 제한 (초기 512MB, 최대 1GB)
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      # 페이지 캐시 크기 제한 (1GB)
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: always

  # 관계형 데이터베이스 서비스 (PostgreSQL)
  # 로컬 PC 관리를 위해 포트를 노출합니다. (배포 시 필요에 따라 격리 가능)
  postgres:
    image: postgres:16-alpine
    container_name: tcagent-postgres
    ports:
      - "5432:5432" # PostgreSQL 외부 포트
    environment:
      - POSTGRES_DB=tcagent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=rhkswp!123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # PostgreSQL 웹 관리 도구 (pgAdmin 4)
  # 로컬 PC 관리를 위해 포트를 노출합니다. (배포 시 필요에 따라 격리 가능)
  pgadmin:
    image: dpage/pgadmin4
    container_name: tcagent-pgadmin
    ports:
      - "5050:80" # pgAdmin 웹 콘솔 포트
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@tcagent.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: always

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  pgadmin_data:
