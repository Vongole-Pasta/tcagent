# ============================================================
#  V&V 기대값 정의서 (수동 큐레이션)
# ============================================================
#
#  이 파일은 .sample/ 소스코드를 사람이 직접 읽고 작성한 기대값입니다.
#  파서가 자동 추출한 결과가 아니므로, 검증의 "정답지" 역할을 합니다.
#
#  구조:
#    endpoints.<Controller>.<method>  — 엔드포인트별 기대값
#    endpoints.<Controller>.<method>.related_types — endpoint별 관련 타입 필드 (소스 기반 직접 명시)
#
#  주의:
#    - endpoint_uri에 trailing slash('/')가 붙은 경우는
#      클래스 레벨 @RequestMapping만 존재하고 메서드 레벨 매핑이 없는 경우입니다.
#    - param_types는 HAS_PARAMETER 관계로 연결될 타입명 목록입니다.
#      (기본 타입 Long, String 등은 TYPE 노드가 아니므로 제외)
#    - internal_calls 주석의 "2depth", "3depth"는 직접 호출이 아닌
#      호출 체인 깊이를 나타냅니다. (CALLS*1.. 로 탐색)
# ============================================================


# ============================================================
#  엔드포인트 기대값
# ============================================================
endpoints:

  # ----------------------------------------------------------------
  #  1. AuthController — 인증 (로그인/로그아웃)
  #     클래스: @RestController @RequestMapping("/api/auth")
  # ----------------------------------------------------------------
  AuthController:
    # 컨트롤러 클래스 레벨 필드 (DI 주입)
    class_level:
      fields:
        authenticationManager: AuthenticationManager   # Spring Security 인증 매니저
        jwtTokenProvider: JwtTokenProvider              # JWT 토큰 생성/검증
        memberRepository: MemberRepository              # 회원 조회 (DB)
        jwtExpiration: long                             # 토큰 만료시간 (ms) — primitive

    # POST /api/auth/login — 로그인 (JWT 발급)
    login:
      http_method: POST
      endpoint_uri: /api/auth/login
      params:
        request: LoginRequest             # 로그인 요청 DTO (email, password)
        httpRequest: HttpServletRequest    # 세션 처리용 서블릿 요청
      param_annotations:
        request: "@Valid @RequestBody"     # Bean Validation + JSON 바디
      return_types:
        - ApiResponse                     # 공통 응답 래퍼
        - TokenResponse                   # JWT 토큰 응답 DTO
      param_types:
        - LoginRequest                    # HAS_PARAMETER 관계 대상
      internal_calls:
        - findByEmail                     # MemberRepository.findByEmail — 이메일로 회원 조회
        - recordLogin                     # member.recordLogin() — 로그인 기록 (변수 타입 resolve 필요)
        - recordLoginFailure              # Member::recordLoginFailure — 실패 기록 (메서드 레퍼런스)
        - generateToken                   # JwtTokenProvider.generateToken — JWT 생성
        - of                              # TokenResponse.of — 정적 팩토리
        - success                         # ApiResponse.success — 성공 응답 생성
        - Meta.now                        # 2depth: success → ApiResponse.Meta.now
        - getMessage                      # 2depth: success → ApiResponseCode.getMessage (프로젝트 내부 Enum 메서드)
      external_calls:
        # ── 직접 호출 (login에서 직접) ──
        - authenticate                    # authenticationManager.authenticate — Spring Security 인증
        - email                           # request.email() — record accessor
        - getContext                       # SecurityContextHolder.getContext — 보안 컨텍스트 획득
        - getGrade                        # member.getGrade() — Enum getter
        - getId                           # session.getId() — 세션 ID 획득
        - getSession                      # httpRequest.getSession — 세션 획득
        - ifPresent                       # Optional.ifPresent — catch 블록에서 실패 기록
        - info                            # log.info — 로그인 성공 로깅
        - name                            # Enum.name() — grade.name()
        - ok                              # ResponseEntity.ok() — 200 응답 생성
        - orElseThrow                     # Optional.orElseThrow — 회원 조회 실패 시 예외
        - password                        # request.password() — record accessor
        - setAttribute                    # session.setAttribute — 세션에 인증 정보 저장
        - setAuthentication               # SecurityContext.setAuthentication — 인증 객체 설정
        # ── 2depth: generateToken 내부 외부호출 ──
        - builder                         # Jwts.builder() — JWT 빌더 생성
        - claim                           # JwtBuilder.claim — 클레임 추가
        - compact                         # JwtBuilder.compact — JWT 문자열 생성
        - expiration                      # JwtBuilder.expiration — 만료시간 설정
        - getTime                         # Date.getTime — 밀리초 획득
        - issuedAt                        # JwtBuilder.issuedAt — 발급시간 설정
        - signWith                        # JwtBuilder.signWith — 서명 키 설정
        - subject                         # JwtBuilder.subject — subject 클레임 설정
        # ── 2depth: success 내부 외부호출 ──
        # ── 2depth+: now (success→now) 내부 외부호출 ──
        - Instant.now                     # Instant.now() — 현재 시각
        - randomUUID                      # UUID.randomUUID() — 고유 ID 생성
        - substring                       # String.substring — 문자열 자르기
        - toEpochMilli                    # Instant.toEpochMilli — 밀리초 변환
        - toString                        # Object.toString — 문자열 변환
      # ── 관련 타입 필드 (소스코드 기반 직접 명시) ──
      related_types:
        # 소스: .sample/.../member/dto/LoginRequest.java (record, L11-14)
        LoginRequest:
          email:
            type: String
            constraint: "@NotBlank @Email"
          password:
            type: String
            constraint: "@NotBlank"
        # 소스: .sample/.../member/dto/TokenResponse.java (record, L8-12)
        TokenResponse:
          accessToken:
            type: String
            constraint: ""
          tokenType:
            type: String
            constraint: ""
          expiresIn:
            type: long
            constraint: ""
        # 소스: .sample/.../common/ApiResponse.java (class, L17-22)
        ApiResponse:
          code:
            type: ApiResponseCode
            constraint: ""
          message:
            type: String
            constraint: ""
          data:
            type: T
            constraint: ""
          meta:
            type: Meta
            constraint: ""
        # 소스: .sample/.../common/ApiResponse.java (내부 static class Meta, L77-98)
        Meta:
          timestamp:
            type: long
            constraint: ""
          traceId:
            type: String
            constraint: ""
        # 소스: .sample/.../common/ApiResponseCode.java (enum, L21-22)
        ApiResponseCode:
          code:
            type: String
            constraint: ""
          message:
            type: String
            constraint: ""

    # POST /api/auth/logout — 로그아웃 (세션 무효화)
    logout:
      http_method: POST
      endpoint_uri: /api/auth/logout
      params:
        request: HttpServletRequest       # 세션 접근용
      param_annotations: {}
      return_types: []                    # void 반환
      param_types: []
      internal_calls: []
      external_calls:
        - getSession                      # httpRequest.getSession(false)
        - invalidate                      # session.invalidate()
        - clearContext                     # SecurityContextHolder.clearContext()
        - ok                              # ResponseEntity.ok()
        - build                           # .build() — 빈 바디 응답 생성
      related_types: {}                    # DTO 사용 없음


  # ----------------------------------------------------------------
  #  2. MemberController — 회원 관리 (CRUD + 검색)
  #     클래스: @RestController @RequestMapping("/api/members")
  # ----------------------------------------------------------------
  MemberController:
    class_level:
      fields:
        memberService: MemberService              # 회원 비즈니스 로직

    # POST /api/members/ — 회원 생성
    createMember:
      http_method: POST
      endpoint_uri: "/api/members/"       # 메서드 레벨 매핑 없음 → trailing slash
      params:
        request: MemberCreateRequest      # 회원 생성 요청 DTO
      param_annotations:
        request: "@Valid @RequestBody"
      return_types:
        - ApiResponse
        - MemberResponse                  # 회원 응답 DTO
      param_types:
        - MemberCreateRequest
      internal_calls:
        - createMember                    # MemberService.createMember
        - success                         # ApiResponse.success
        # ── 2depth: createMember 내부 ──
        - validateEmail                   # this.validateEmail — 이메일 중복 검증
        - from                            # MemberResponse.from — Entity→DTO 변환
        - sendWelcome                     # NotificationService.sendWelcome — 환영 알림
        - addAddress                      # member::addAddress — 메서드 레퍼런스
        # ── 2depth: success 내부 ──
        - Meta.now                        # Meta.now — 메타 정보 생성
        - getMessage                      # ApiResponseCode.getMessage — 응답 코드 메시지
        # ── 3depth: validateEmail 내부 ──
        - existsByEmail                   # MemberRepository.existsByEmail — 이메일 존재 확인
        # ── 3depth: from 내부 ──
        - getId                           # BaseEntity.getId — PK 조회
        - getFullName                     # Member.getFullName — 이름 조합
        - isActive                        # Member.isActive — 활성 여부
        # ── 3depth: sendWelcome 내부 ──
        - sendToMember                    # NotificationService.sendToMember — SSE 알림 전송
      external_calls:
        # ── 직접 호출 (컨트롤러) ──
        - body                            # ResponseEntity.body()
        - status                          # ResponseEntity.status(CREATED)
        # ── 2depth: createMember 내부 ──
        - addresses                       # request.addresses() — record accessor
        - email                           # request.email() — record accessor
        - encode                          # passwordEncoder.encode — Spring Security
        - firstName                       # request.firstName() — record accessor
        - forEach                         # List.forEach — addAddress 반복
        - lastName                        # request.lastName() — record accessor
        - password                        # request.password() — record accessor
        - save                            # memberRepository.save — JpaRepository 상속
        # ── 2depth+: from (MemberResponse.from) 내부 ──
        - getEmail                        # Lombok @Getter
        - getGrade                        # Lombok @Getter
        - getTags                         # Lombok @Getter
        # ── 2depth+: now (Meta.now) 내부 ──
        - Instant.now                     # Instant.now() — 현재 시각
        - randomUUID                      # UUID.randomUUID() — 고유 ID
        - substring                       # String.substring — 문자열 자르기
        - toEpochMilli                    # Instant.toEpochMilli — 밀리초 변환
        - toString                        # Object.toString — 문자열 변환
        # ── 3depth: addAddress 내부 ──
        - add                             # List.add — 주소 추가
        # ── 3depth: sendWelcome 내부 ──
        - info                            # log.info — 환영 알림 로깅
        # ── 3depth+: sendToMember 내부 ──
        - data                            # SseEmitter.EventBuilder.data
        - event                           # SseEmitter.event — SSE 이벤트 생성
        - get                             # Map.get — emitter 조회
        - name                            # SseEmitter.EventBuilder.name
        - remove                          # Map.remove — emitter 제거
        - send                            # SseEmitter.send — SSE 전송
        - warn                            # log.warn — 발송 실패 로깅
      related_types:
        # 소스: .sample/.../member/dto/MemberCreateRequest.java (record, L15-21)
        MemberCreateRequest:
          email:
            type: String
            constraint: "@NotBlank @Email"
          firstName:
            type: String
            constraint: "@NotBlank"
          lastName:
            type: String
            constraint: "@NotBlank"
          password:
            type: String
            constraint: ""
          addresses:
            type: "List<Address>"
            constraint: "@Valid"
        # 소스: .sample/.../member/dto/MemberResponse.java (record, L13-19)
        MemberResponse:
          id:
            type: Long
            constraint: ""
          email:
            type: String
            constraint: ""
          fullName:
            type: String
            constraint: ""
          grade:
            type: MemberGrade
            constraint: ""
          tags:
            type: "List<String>"
            constraint: ""
          active:
            type: boolean
            constraint: ""
        # 소스: .sample/.../member/entity/Address.java (class, L11-15)
        Address:
          street:
            type: String
            constraint: ""
          city:
            type: String
            constraint: ""
          zipCode:
            type: String
            constraint: ""
        # 소스: .sample/.../common/ApiResponse.java (class, L17-22)
        ApiResponse:
          code:
            type: ApiResponseCode
            constraint: ""
          message:
            type: String
            constraint: ""
          data:
            type: T
            constraint: ""
          meta:
            type: Meta
            constraint: ""
        # 소스: .sample/.../common/ApiResponse.java (내부 static class Meta, L77-98)
        Meta:
          timestamp:
            type: long
            constraint: ""
          traceId:
            type: String
            constraint: ""
        # 소스: .sample/.../common/ApiResponseCode.java (enum, L21-22)
        ApiResponseCode:
          code:
            type: String
            constraint: ""
          message:
            type: String
            constraint: ""

    # GET /api/members/{id:[0-9]+} — 회원 단건 조회
    getMember:
      http_method: GET
      endpoint_uri: "/api/members/{id:[0-9]+}"   # 정규식 PathVariable
      params:
        id: Long
      param_annotations: {}
      return_types:
        - ApiResponse
        - MemberResponse
      param_types: []                     # Long은 기본 타입이라 TYPE 노드 없음
      internal_calls:
        - getMember                       # MemberService.getMember
        - success                         # ApiResponse.success
        # ── 2depth: getMember 내부 ──
        - from                            # MemberResponse.from — Entity→DTO 변환
        # ── 2depth: success 내부 ──
        - Meta.now                        # Meta.now
        - getMessage                      # ApiResponseCode.getMessage
        # ── 3depth: from 내부 ──
        - getId                           # BaseEntity.getId
        - getFullName                     # Member.getFullName
        - isActive                        # Member.isActive
      external_calls:
        # ── 직접 호출 (컨트롤러) ──
        - ok                              # ResponseEntity.ok()
        # ── 2depth: getMember 내부 ──
        - findById                        # JpaRepository.findById — 상속 메서드
        - orElseThrow                     # Optional.orElseThrow
        # ── 2depth+: from 내부 ──
        - getEmail                        # Lombok @Getter
        - getGrade                        # Lombok @Getter
        - getTags                         # Lombok @Getter
        # ── 2depth+: now 내부 ──
        - Instant.now                     # Instant.now()
        - randomUUID                      # UUID.randomUUID()
        - substring                       # String.substring
        - toEpochMilli                    # Instant.toEpochMilli
        - toString                        # Object.toString
      related_types:
        # 소스: .sample/.../member/dto/MemberResponse.java (record, L13-19)
        MemberResponse:
          id:
            type: Long
            constraint: ""
          email:
            type: String
            constraint: ""
          fullName:
            type: String
            constraint: ""
          grade:
            type: MemberGrade
            constraint: ""
          tags:
            type: "List<String>"
            constraint: ""
          active:
            type: boolean
            constraint: ""
        # 소스: .sample/.../common/ApiResponse.java (class, L17-22)
        ApiResponse:
          code:
            type: ApiResponseCode
            constraint: ""
          message:
            type: String
            constraint: ""
          data:
            type: T
            constraint: ""
          meta:
            type: Meta
            constraint: ""
        # 소스: .sample/.../common/ApiResponse.java (내부 static class Meta, L77-98)
        Meta:
          timestamp:
            type: long
            constraint: ""
          traceId:
            type: String
            constraint: ""
        # 소스: .sample/.../common/ApiResponseCode.java (enum, L21-22)
        ApiResponseCode:
          code:
            type: String
            constraint: ""
          message:
            type: String
            constraint: ""

    # GET /api/members/ — 회원 목록 (페이징)
    listMembers:
      http_method: GET
      endpoint_uri: "/api/members/"
      params:
        pageable: Pageable                # Spring Data 페이징 파라미터
      param_annotations: {}
      return_types:
        - ApiResponse
        - PagedResponse                   # 페이징 응답 래퍼
        - MemberResponse
      param_types: []
      internal_calls:
        - findMembers                     # MemberService.findMembers(Pageable)
        - success                         # ApiResponse.success
        # ── 2depth: findMembers 내부 ──
        - from                            # PagedResponse.from + MemberResponse::from (메서드 레퍼런스)
        # ── 2depth: success 내부 ──
        - Meta.now                        # Meta.now
        - getMessage                      # ApiResponseCode.getMessage
        # ── 3depth: MemberResponse.from 내부 ──
        - getId                           # BaseEntity.getId
        - getFullName                     # Member.getFullName
        - isActive                        # Member.isActive
      external_calls:
        # ── 직접 호출 (컨트롤러) ──
        - ok                              # ResponseEntity.ok()
        # ── 2depth: findMembers 내부 ──
        - findAll                         # JpaRepository.findAll(Pageable) — 상속 메서드
        - map                             # Page.map — 페이지 변환
        # ── 2depth+: PagedResponse.from 내부 ──
        - getContent                      # Page.getContent
        - getNumber                       # Page.getNumber
        - getSize                         # Page.getSize
        - getTotalElements                # Page.getTotalElements
        - getTotalPages                   # Page.getTotalPages
        # ── 3depth: MemberResponse.from 내부 ──
        - getEmail                        # Lombok @Getter
        - getGrade                        # Lombok @Getter
        - getTags                         # Lombok @Getter
        # ── 2depth+: now 내부 ──
        - Instant.now                     # Instant.now()
        - randomUUID                      # UUID.randomUUID()
        - substring                       # String.substring
        - toEpochMilli                    # Instant.toEpochMilli
        - toString                        # Object.toString
      related_types:
        # 소스: .sample/.../common/PagedResponse.java (record, L11-17)
        PagedResponse:
          content:
            type: "List<T>"
            constraint: ""
          page:
            type: int
            constraint: ""
          size:
            type: int
            constraint: ""
          totalElements:
            type: long
            constraint: ""
          totalPages:
            type: int
            constraint: ""
        # 소스: .sample/.../member/dto/MemberResponse.java (record, L13-19)
        MemberResponse:
          id:
            type: Long
            constraint: ""
          email:
            type: String
            constraint: ""
          fullName:
            type: String
            constraint: ""
          grade:
            type: MemberGrade
            constraint: ""
          tags:
            type: "List<String>"
            constraint: ""
          active:
            type: boolean
            constraint: ""
        # 소스: .sample/.../common/ApiResponse.java (class, L17-22)
        ApiResponse:
          code:
            type: ApiResponseCode
            constraint: ""
          message:
            type: String
            constraint: ""
          data:
            type: T
            constraint: ""
          meta:
            type: Meta
            constraint: ""
        # 소스: .sample/.../common/ApiResponse.java (내부 static class Meta, L77-98)
        Meta:
          timestamp:
            type: long
            constraint: ""
          traceId:
            type: String
            constraint: ""
        # 소스: .sample/.../common/ApiResponseCode.java (enum, L21-22)
        ApiResponseCode:
          code:
            type: String
            constraint: ""
          message:
            type: String
            constraint: ""

    # GET|POST /api/members/search — 회원 검색
    searchMembers:
      http_method:                        # 복합 매핑 (GET + POST)
        - GET
        - POST
        - "GET,POST"                      # 파서가 쉼표 구분 문자열로 저장할 수도 있음
      endpoint_uri: /api/members/search
      params:
        keyword: String                   # 검색 키워드
      param_annotations: {}
      return_types:
        - ApiResponse
        - MemberResponse
      param_types: []
      internal_calls:
        - searchMembers                   # MemberService.searchMembers
        - success                         # ApiResponse.success
        # ── 2depth: searchMembers 내부 ──
        - findMembers                     # this.findMembers() — keyword blank일 때 전체 조회 위임
        - findByFirstNameContainingOrLastNameContaining  # MemberRepository — Spring Data 쿼리 메서드
        # ── 2depth: success 내부 ──
        - Meta.now                        # Meta.now
        - getMessage                      # ApiResponseCode.getMessage
        # ── 3depth: MemberResponse::from (메서드 레퍼런스) ──
        - from                            # MemberResponse.from — 검색 결과 변환
        - getId                           # BaseEntity.getId
        - getFullName                     # Member.getFullName
        - isActive                        # Member.isActive
      external_calls:
        # ── 직접 호출 (컨트롤러) ──
        - ok                              # ResponseEntity.ok()
        # ── 2depth: searchMembers 내부 ──
        - isBlank                         # String.isBlank — keyword 빈값 체크
        - map                             # Page/Stream.map — 결과 변환
        - toList                          # Stream.toList — 리스트 변환
        - unpaged                         # Pageable.unpaged — 페이징 없이 전체 조회
        # ── 3depth: findMembers() 내부 (keyword blank 분기) ──
        - findAll                         # JpaRepository.findAll — 전체 조회
        - stream                          # List.stream
        # ── 3depth: MemberResponse.from 내부 ──
        - getEmail                        # Lombok @Getter
        - getGrade                        # Lombok @Getter
        - getTags                         # Lombok @Getter
        # ── 2depth+: now 내부 ──
        - Instant.now                     # Instant.now()
        - randomUUID                      # UUID.randomUUID()
        - substring                       # String.substring
        - toEpochMilli                    # Instant.toEpochMilli
        - toString                        # Object.toString
