  # ----------------------------------------------------------------
  #  5. OrderController — 주문 관리
  #     클래스: @RestController @RequestMapping("/api/orders")
  #     참고: Order 엔티티는 Lombok @Getter 사용, 수동 메서드: addItem, setDeliveryInfo, changeStatus, recalculateTotal
  #     참고: OrderItem 엔티티는 Lombok 미사용, 모든 getter를 직접 작성
  #     참고: Product 엔티티는 Lombok 미사용, 모든 getter를 직접 작성
  # ----------------------------------------------------------------
  OrderController:
    class_level:
      fields:
        orderService: OrderService                # 주문 비즈니스 로직

    # POST /api/orders/ — 주문 생성
    createOrder:
      http_method: POST
      endpoint_uri: "/api/orders/"
      params:
        request: OrderCreateRequest
      param_annotations:
        request: "@Valid @RequestBody"
      return_types:
        - ApiResponse
        - OrderResponse
      param_types:
        - OrderCreateRequest
      internal_calls:
        - createOrder                     # OrderService.createOrder
        - success                         # ApiResponse.success
        # ── 2depth: createOrder 내부 ──
        - from                            # OrderResponse.from — Entity→DTO 변환
        - addItem                         # Order.addItem — 주문항목 추가 (수동 메서드)
        - setDeliveryInfo                 # Order.setDeliveryInfo — 배송 정보 설정 (수동 메서드)
        - validate                        # OrderValidator.validate — 주문 검증
        - sendOrderConfirmation           # NotificationService.sendOrderConfirmation — 알림
        - decreaseStock                   # Product.decreaseStock — 재고 차감 (수동 메서드)
        - getProduct                      # OrderItem.getProduct — 수동 getter
        - getQuantity                     # OrderItem.getQuantity — 수동 getter
        # ── 2depth: success 내부 ──
        - Meta.now                        # Meta.now
        - getMessage                      # ApiResponseCode.getMessage
        # ── 3depth: OrderResponse.from 내부 ──
        - getId                           # BaseEntity.getId — 수동 getter
        # ── 3depth: addItem 내부 ──
        - recalculateTotal                # Order.recalculateTotal — private, 합계 재계산
        # ── 3depth: validate 내부 ──
        - validateStock                   # OrderValidator.validateStock — 재고 검증
        - validateMemberGrade             # OrderValidator.validateMemberGrade — 등급 검증
        # ── 3depth: sendOrderConfirmation 내부 ──
        - sendToMember                    # NotificationService.sendToMember — SSE 전송
        # ── 4depth: OrderItemResponse.from 내부 (OrderResponse.from에서 호출) ──
        - getName                         # Product.getName — 수동 getter (OrderItemResponse.from + validateStock)
        - getUnitPrice                    # OrderItem.getUnitPrice — 수동 getter
        - getSubtotal                     # OrderItem.getSubtotal — 수동 getter (BigDecimal 연산)
        # ── 4depth: validateStock 내부 ──
        - isAvailable                     # Product.isAvailable — 수동 메서드
        - getStockQuantity                # Product.getStockQuantity — 수동 getter
        # ── 5depth: canTransitionTo는 createOrder에선 미사용 ──
      external_calls:
        # ── 직접 호출 (컨트롤러) ──
        - status                          # ResponseEntity.status(CREATED)
        - body                            # ResponseEntity.body()
        # ── 2depth: createOrder 내부 ──
        - findById                        # JpaRepository.findById — member, product 조회
        - orElseThrow                     # Optional.orElseThrow
        - memberId                        # OrderCreateRequest record accessor
        - deliveryAddress                 # OrderCreateRequest record accessor
        - recipientName                   # OrderCreateRequest record accessor
        - phone                           # OrderCreateRequest record accessor
        - items                           # OrderCreateRequest record accessor
        - productId                       # OrderItemRequest record accessor
        - quantity                        # OrderItemRequest record accessor
        - getItems                        # Order Lombok @Getter
        - forEach                         # Iterable.forEach — 재고 차감 루프
        - save                            # JpaRepository.save — 주문 저장
        # ── 3depth: OrderResponse.from 내부 ──
        - getMember                       # Order Lombok @Getter
        - getEmail                        # Member Lombok @Getter
        - getStatus                       # Order Lombok @Getter
        - getTotalAmount                  # Order Lombok @Getter
        - stream                          # List.stream
        - map                             # Stream.map
        - toList                          # Stream.toList
        # ── 3depth: addItem 내부 (List.add) ──
        - add                             # List.add — items 리스트에 추가
        # ── 3depth: sendOrderConfirmation 내부 ──
        - info                            # log.info — 알림 로깅
        # ── 4depth: recalculateTotal 내부 ──
        - reduce                          # Stream.reduce — BigDecimal 합산
        # ── 4depth: sendToMember 내부 ──
        - get                             # Map.get — emitter 조회
        - send                            # SseEmitter.send
        - event                           # SseEmitter.event — 이벤트 빌더
        - name                            # SseEmitter.EventBuilder.name
        - data                            # SseEmitter.EventBuilder.data
        - remove                          # Map.remove — emitter 제거
        - warn                            # log.warn — 발송 실패 로깅
        # ── 4depth: validateMemberGrade 내부 ──
        - getGrade                        # Member Lombok @Getter
