        - getBytes                        # String.getBytes


  # ----------------------------------------------------------------
  #  6. NotificationController — 알림 (SSE + 벌크)
  #     클래스: @RestController @RequestMapping("/api/notifications")
  # ----------------------------------------------------------------
  NotificationController:
    class_level:
      fields:
        - notificationService             # NotificationService — 알림 비즈니스 로직

    # GET /api/notifications/subscribe — SSE 구독
    subscribe:
      http_method: GET
      endpoint_uri: /api/notifications/subscribe
      params:
        memberId: Long
      param_annotations: {}
      return_types: []                    # SseEmitter — TYPE 노드 없음
      param_types: []
      internal_calls:
        - createEmitter                   # NotificationService.createEmitter
      external_calls:
        # ── 2depth: createEmitter 내부 ──
        - put                             # Map.put — emitters에 등록
        - onCompletion                    # SseEmitter.onCompletion — 완료 콜백
        - onTimeout                       # SseEmitter.onTimeout — 타임아웃 콜백
        - remove                          # Map.remove — 콜백 내부 emitter 제거

    # POST /api/notifications/send — 벌크 알림 발송
    sendNotification:
      http_method: POST
      endpoint_uri: /api/notifications/send
      params:
        request: NotificationRequest
      param_annotations: {}
      return_types: []                    # void — 200 OK (ResponseEntity<Void>)
      param_types:
        - NotificationRequest
      internal_calls:
        - sendBulk                        # NotificationService.sendBulk
        # ── 2depth: sendBulk 내부 ──
        - sendToMember                    # NotificationService.sendToMember — private
      external_calls:
        # ── 직접 호출 (컨트롤러) ──
        - ok                              # ResponseEntity.ok()
        - build                           # ResponseEntity.BodyBuilder.build()
        - memberIds                       # NotificationRequest record accessor
        - message                         # NotificationRequest record accessor
        # ── 3depth: sendToMember 내부 ──
        - get                             # Map.get — emitter 조회
        - send                            # SseEmitter.send — SSE 전송
        - event                           # SseEmitter.event — 이벤트 빌더
        - name                            # SseEmitter.EventBuilder.name
        - data                            # SseEmitter.EventBuilder.data
        - remove                          # Map.remove — emitter 제거
        - warn                            # log.warn — 발송 실패 로깅


# ============================================================
#  DTO / VO 필드 기대값
# ============================================================
#
#  각 DTO의 필드명, 타입, 제약조건(@Validation 어노테이션)을 정의합니다.
#  constraint가 빈 문자열("")이면 검증 어노테이션이 없는 필드입니다.
# ============================================================
dto_fields:

  # ---- Auth 관련 DTO ----

  # 로그인 요청
  LoginRequest:
    email:
      type: String
      constraint: "@NotBlank @Email"      # 빈값 불가 + 이메일 형식
    password:
      type: String
      constraint: "@NotBlank"

  # JWT 토큰 응답
  TokenResponse:
    accessToken:
      type: String
      constraint: ""
    tokenType:
      type: String
      constraint: ""
    expiresIn:
      type: long                          # primitive long
      constraint: ""

  # ---- Member 관련 DTO ----

  # 회원 생성 요청
  MemberCreateRequest:
    email:
      type: String
      constraint: "@NotBlank @Email"
    firstName:
      type: String
      constraint: "@NotBlank"
    lastName:
      type: String
      constraint: "@NotBlank"
    password:
      type: String
      constraint: ""
    addresses:
      type: "List<Address>"              # 중첩 VO 리스트
      constraint: "@Valid"               # 리스트 내 각 Address도 검증

  # 회원 응답
  MemberResponse:
    id:
      type: Long                          # wrapper Long
      constraint: ""
    email:
      type: String
      constraint: ""
    fullName:
      type: String
      constraint: ""
    grade:
      type: MemberGrade                   # Enum 타입
      constraint: ""
    tags:
      type: "List<String>"
      constraint: ""
    active:
      type: boolean                       # primitive boolean
      constraint: ""

  # 주소 VO (Value Object)
  Address:
    street:
      type: String
      constraint: ""
    city:
      type: String
      constraint: ""
    zipCode:
      type: String
      constraint: ""

  # ---- Product 관련 DTO ----

  # 상품 생성 요청 (ProductDto.Create 내부 클래스)
  Create:
    name:
      type: String
      constraint: "@NotBlank"
    price:
      type: BigDecimal
      constraint: "@NotNull"
    description:
      type: String
      constraint: ""
    categoryId:
      type: Long
      constraint: ""
    stockQuantity:
      type: int                           # primitive int
      constraint: ""

  # 상품 수정 요청 (ProductDto.Update 내부 클래스)
  Update:
    name:
      type: String
      constraint: ""
    price:
      type: BigDecimal
      constraint: ""

  # 상품 응답 (ProductDto.Response 내부 클래스)
  Response:
    id:
      type: Long
      constraint: ""
    name:
      type: String
      constraint: ""
    price:
      type: BigDecimal
      constraint: ""
    description:
      type: String
      constraint: ""
    categoryName:
      type: String
      constraint: ""
    stockQuantity:
      type: int
      constraint: ""
    active:
      type: boolean
      constraint: ""

  # ---- Order 관련 DTO ----

  # 주문 생성 요청
  OrderCreateRequest:
    memberId:
      type: Long
      constraint: "@NotNull"
    items:
      type: "List<OrderItemRequest>"
      constraint: "@Valid"               # 리스트 내 각 항목도 검증
    recipientName:
      type: String
      constraint: ""
    phone:
      type: String
      constraint: ""
    deliveryAddress:
      type: Address
      constraint: "@Valid"               # 중첩 VO 검증

  # 주문 항목 요청
  OrderItemRequest:
    productId:
      type: Long
      constraint: "@NotNull"
    quantity:
      type: int
      constraint: "@Min(1)"             # 최소 1개

  # 주문 응답
  OrderResponse:
    id:
      type: Long
      constraint: ""
    memberEmail:
      type: String
      constraint: ""
    status:
      type: OrderStatus                   # Enum 타입
      constraint: ""
    items:
      type: "List<OrderItemResponse>"
      constraint: ""
    totalAmount:
      type: BigDecimal
      constraint: ""

  # 주문 항목 응답
  OrderItemResponse:
    productName:
      type: String
      constraint: ""
    quantity:
      type: int
      constraint: ""
    unitPrice:
      type: BigDecimal
      constraint: ""
    subtotal:
      type: BigDecimal
      constraint: ""

  # ---- Notification 관련 DTO ----

  # 알림 발송 요청
  NotificationRequest:
    memberIds:
      type: "List<Long>"
      constraint: ""
    message:
      type: String
      constraint: ""
